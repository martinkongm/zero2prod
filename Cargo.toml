[package]
name = "zero2prod"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "zero2prod"

[dependencies]
actix-web = "4.15.0"
chrono = "0.4.45"
config = "0.15.27"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-aux = "4.7.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate"] }
tokio = { version = "1.53.2", features = ["macros", "rt", "rt-multi-thread"] }
tracing = { version = "0.1.44", features = ["log"] }
tracing-actix-web = "0.7.25"
tracing-bunyan-formatter = "0.3.11"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.23", features = ["registry", "env-filter"] }
unicode-segmentation = "1.13.3"
uuid = { version = "1.28.0", features = ["v4"] }
validator = { version = "0.21.0", features = ["derive"] }

[dependencies.reqwest]
version = "0.13.5"
default-features = false
features = ["json", "rustls"]

[dev-dependencies]
claims = "0.8.0"
fake = "5.1.0"
quickcheck = "1.1.0"
quickcheck_macros = "1.2.0"
rand = "0.10.3"
serde_json = "1.0.154"
wiremock = "0.6.5"
